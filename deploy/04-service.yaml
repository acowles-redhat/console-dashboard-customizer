apiVersion: v1
kind: Service
metadata:
  name: dashboard-customizer
  namespace: dashboard-customizer
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: dashboard-customizer-cert
  labels:
    app: dashboard-customizer
spec:
  selector:
    app: dashboard-customizer
  ports:
    - port: 9443
      targetPort: 9443
      protocol: TCP
